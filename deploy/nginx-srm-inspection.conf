server {
    listen 8091 ssl;
    server_name inspection.example.com;

    ssl_certificate /etc/nginx/srm-inspection.crt;
    ssl_certificate_key /etc/nginx/srm-inspection.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The application login protects APIs, reports and screenshots.
    auth_basic off;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
